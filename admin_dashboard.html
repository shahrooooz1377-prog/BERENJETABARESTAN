{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
  <h3>پنل مدیریت</h3>
  <a class="btn btn-secondary" href="/admin/logout">خروج</a>
</div>
<div class="row mt-3">
  <div class="col-md-4"><div class="card p-3">مشتریان: {{ customers }}</div></div>
  <div class="col-md-4"><div class="card p-3">جشنواره‌ها: {{ festivals }}</div></div>
  <div class="col-md-4"><div class="card p-3">پرسش‌ها: {{ faqs }}</div></div>
</div>
<hr>
<div class="row">
  <div class="col-md-6">
    <h5>افزودن جشنواره</h5>
    <form method="post" action="/admin/add-festival">
      <input class="form-control mb-2" name="title" placeholder="عنوان" required>
      <input class="form-control mb-2" name="date" placeholder="تاریخ" required>
      <input class="form-control mb-2" name="image_url" placeholder="آدرس تصویر (اختیاری)">
      <textarea class="form-control mb-2" name="description" placeholder="توضیحات" required></textarea>
      <button class="btn btn-success">افزودن</button>
    </form>
  </div>
  <div class="col-md-6">
    <h5>افزودن پرسش و پاسخ</h5>
    <form method="post" action="/admin/add-faq">
      <input class="form-control mb-2" name="question" placeholder="سوال" required>
      <input class="form-control mb-2" name="keywords" placeholder="کلمات کلیدی (با کاما جدا کنید)">
      <textarea class="form-control mb-2" name="answer" placeholder="پاسخ" required></textarea>
      <button class="btn btn-primary">افزودن FAQ</button>
    </form>
  </div>
</div>
<hr>
<div class="row">
  <div class="col-md-6"><a class="btn btn-info" href="/admin/customers">لیست مشتریان</a></div>
  <div class="col-md-6"><a class="btn btn-info" href="/admin/festivals">مدیریت جشنواره‌ها</a> <a class="btn btn-info" href="/admin/faqs">مدیریت سوالات</a></div>
</div>
{% endblock %}
